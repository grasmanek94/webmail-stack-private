# Local mailbox and processing stack. STRATO remains the public MX.
# Deliberately does NOT publish inbound TCP/25 to the host.
name: webmail
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/redis:/data
    networks: [mailnet]

  resolver:
    image: ghcr.io/mailu/unbound:${MAILU_VERSION:-2024.06}
    env_file: ./mailu.env
    restart: unless-stopped
    networks:
      mailnet:
        ipv4_address: ${RESOLVER_IP:-192.168.203.254}

  front:
    image: ghcr.io/mailu/nginx:${MAILU_VERSION:-2024.06}
    restart: unless-stopped
    env_file: ./mailu.env
    ports:
      # Mailu administration HTTPS; public-facing later only after HTTPS/cert validation.
      - "${BIND_IP:-0.0.0.0}:${ADMIN_HTTPS_PORT:-8443}:443"
      - "${BIND_IP:-0.0.0.0}:${IMAPS_PORT:-993}:993"
      - "${BIND_IP:-0.0.0.0}:${SMTPS_PORT:-465}:465"
      - "${BIND_IP:-0.0.0.0}:${SUBMISSION_PORT:-587}:587"
      - "${BIND_IP:-0.0.0.0}:${SIEVE_PORT:-4190}:4190"
    volumes:
      - ${DATA_ROOT}/certs:/certs:ro
      - ${DATA_ROOT}/overrides/nginx:/overrides:ro
    networks: [mailnet]
    depends_on: [resolver]
    dns: ["${RESOLVER_IP:-192.168.203.254}"]

  admin:
    image: ghcr.io/mailu/admin:${MAILU_VERSION:-2024.06}
    restart: unless-stopped
    env_file: ./mailu.env
    volumes:
      - ${DATA_ROOT}/data:/data
      - ${DATA_ROOT}/dkim:/dkim
    networks: [mailnet]
    depends_on: [redis, resolver]
    dns: ["${RESOLVER_IP:-192.168.203.254}"]

  imap:
    image: ghcr.io/mailu/dovecot:${MAILU_VERSION:-2024.06}
    restart: unless-stopped
    env_file: ./mailu.env
    volumes:
      - ${DATA_ROOT}/mail:/mail
      - ${DATA_ROOT}/overrides/dovecot:/overrides:ro
    networks: [mailnet]
    depends_on: [front]
    dns: ["${RESOLVER_IP:-192.168.203.254}"]

  smtp:
    image: ghcr.io/mailu/postfix:${MAILU_VERSION:-2024.06}
    restart: unless-stopped
    env_file: ./mailu.env
    volumes:
      - ${DATA_ROOT}/mailqueue:/queue
      - ${DATA_ROOT}/overrides/postfix:/overrides:ro
    networks: [mailnet]
    depends_on: [front]
    dns: ["${RESOLVER_IP:-192.168.203.254}"]

  antispam:
    image: ghcr.io/mailu/rspamd:${MAILU_VERSION:-2024.06}
    restart: unless-stopped
    env_file: ./mailu.env
    volumes:
      - ${DATA_ROOT}/filter:/var/lib/rspamd
      - ${DATA_ROOT}/overrides/rspamd:/overrides:ro
    networks: [mailnet]
    depends_on: [front, redis]
    dns: ["${RESOLVER_IP:-192.168.203.254}"]

  fetchmail:
    image: ghcr.io/mailu/fetchmail:${MAILU_VERSION:-2024.06}
    restart: unless-stopped
    env_file: ./mailu.env
    volumes:
      - ${DATA_ROOT}/data/fetchmail:/data
    networks: [mailnet]
    depends_on: [admin, smtp, imap]
    dns: ["${RESOLVER_IP:-192.168.203.254}"]

  roundcube:
    # Separate upstream Roundcube image supports custom From plugin via Composer.
    image: roundcube/roundcubemail:${ROUNDCUBE_VERSION:-latest}
    restart: unless-stopped
    environment:
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_DEFAULT_HOST: "tls://front"
      ROUNDCUBEMAIL_DEFAULT_PORT: "143"
      ROUNDCUBEMAIL_SMTP_SERVER: "tls://front"
      ROUNDCUBEMAIL_SMTP_PORT: "587"
      ROUNDCUBEMAIL_SKIN: elastic
      # Stable key; changing this logs out all Roundcube sessions.
      ROUNDCUBEMAIL_DES_KEY: "${ROUNDCUBE_DES_KEY:?Run ./webmail.sh prepare first}"
      # Upload size; total SMTP message limit remains 50,000,000 bytes.
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: "${ROUNDCUBE_UPLOAD_LIMIT:-30M}"
      ROUNDCUBEMAIL_COMPOSER_PLUGINS: "r3c/custom-from:1.8.2"
      ROUNDCUBEMAIL_INSTALL_PLUGINS: "1"
      ROUNDCUBEMAIL_PLUGINS: "archive,zipdownload,managesieve,markasjunk,custom_from"
    volumes:
      - ${DATA_ROOT}/roundcube/db:/var/roundcube/db
      - ./roundcube:/var/roundcube/config:ro
    networks: [mailnet]
    depends_on: [front, imap, smtp]

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${BIND_IP:-0.0.0.0}:${WEB_HTTPS_PORT:-443}:443"
      - "${BIND_IP:-0.0.0.0}:${WEB_HTTP_PORT:-8080}:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DATA_ROOT}/certs:/certs:ro
    networks: [mailnet]
    depends_on: [roundcube]

networks:
  mailnet:
    driver: bridge
    ipam:
      config:
        - subnet: ${MAILU_SUBNET:-192.168.203.0/24}
